[package]
name = "shellhive"
version = "0.1.0"
description = "Terminal com abas agrupadas para o Claude Code"
authors = ["David Gonçalves <davidsg.dev@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shellhive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
base64 = "0.23.1"
dirs = "7.0.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

name: windows

# Smoke-tests the Windows build on pull requests; releases build Windows in
# release.yml. The installer is attached to each run.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHELLHIVE_SENTRY_DSN: ${{ secrets.SHELLHIVE_SENTRY_DSN }}
        run: pnpm tauri build --bundles nsis

      # Checks what can run without a person at the keyboard: hook mode, and
      # the app starting and answering on its local server.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/shellhive.exe"

          $context = '{}' | & $exe --hook session-start
          if ($context -notmatch 'SessionStart') { throw "hook mode printed: $context" }

          $app = Start-Process -FilePath $exe -PassThru
          $body = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          $tools = $null
          for ($i = 0; $i -lt 60 -and -not $tools; $i++) {
            Start-Sleep -Seconds 1
            try {
              # The app writes a fresh token on every launch and refuses calls without it.
              $token = Get-Content -Raw "$env:APPDATA\shellhive\token"
              $tools = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:47831/mcp" -Body $body -ContentType "application/json" -Headers @{ "X-Shellhive-Token" = $token.Trim() }
            } catch {}
          }
          if (-not $tools) { throw "the app never answered on port 47831" }
          $names = $tools.result.tools.name -join ", "
          Write-Host "MCP tools: $names"
          if ($names -notmatch 'suggest_command') { throw "unexpected tools: $names" }

          # A GUI-subsystem exe is not waited on when nothing reads its output,
          # so run it the way Claude Code does: stdin from a file, wait for exit.
          $payload = New-TemporaryFile
          Set-Content -Path $payload -Value '{"hook_event_name":"Notification","message":"smoke"}'
          $hook = Start-Process -FilePath $exe -ArgumentList "--hook", "forward" -RedirectStandardInput $payload -NoNewWindow -Wait -PassThru
          if ($hook.ExitCode -ne 0) { throw "hook forward exited $($hook.ExitCode)" }

          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: shellhive-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

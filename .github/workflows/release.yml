name: release

# Releases whatever lands on main, as soon as the version in tauri.conf.json
# has no tag yet. Bump it with `pnpm bump` and merge; the rest is automatic.
# A version with a pre-release suffix (1.1.0-beta.1) ships as a GitHub
# pre-release, reaching only the beta channel; any other version is a regular
# release, which reaches both channels.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while a release is building would build the same version twice.
# Queuing them means the later run sees the tag and stops at the decide job.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      beta: ${{ steps.check.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "beta=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "beta=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The release stays a draft until the manifest job publishes it, so apps
  # checking for updates never see a release without its latest.json.
  create-release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.decide.outputs.version }}
        run: |
          # A failed run leaves its draft behind; start from a clean one.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old"
          done
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Shellhive $TAG" \
            -F draft=true \
            -F prerelease=${{ needs.decide.outputs.beta }} \
            -f body="$(cat <<'BODY'
          Qual arquivo baixar:
          - Mac com chip Apple (M1 ou mais novo): `macOS-Apple-Silicon.dmg`
          - Mac com processador Intel: `macOS-Intel.dmg`
          - Linux (qualquer distribuição): `Linux.AppImage`
          - Debian ou Ubuntu: `Linux-Debian-Ubuntu.deb`
          - Windows 10 ou 11: `Windows.exe` (o Windows mostra um aviso do SmartScreen porque o instalador não é assinado; clique em "Mais informações" e depois em "Executar assim mesmo")

          Os arquivos `_atualizacao` e `.sig` são usados pela atualização automática e não precisam ser baixados. O app se atualiza sozinho a partir daqui.
          BODY
          )" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [decide, create-release]
    if: needs.decide.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          # The bundle targets in tauri.conf.json are macOS and Linux ones.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev build-essential curl wget file libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Where opted-in error reports go; builds without it keep errors local.
          SHELLHIVE_SENTRY_DSN: ${{ secrets.SHELLHIVE_SENTRY_DSN }}
          # Ad-hoc signature: without any signature an arm64 build downloaded
          # from the internet is reported as damaged instead of unidentified.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # Composed once by the manifest job; parallel jobs overwrote each other.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  manifest:
    needs: [decide, create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.decide.outputs.version }}
      RELEASE_ID: ${{ needs.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Give the assets readable names
        run: node .github/scripts/rename-assets.mjs
      - name: Compose the updater manifest
        run: node .github/scripts/manifest.mjs
      # Publishing creates the tag, now that every file the updater needs is in
      # place. A regular release becomes the latest, which is the regular
      # channel; a beta stays a pre-release, which GitHub never makes latest.
      - name: Publish the release
        run: |
          if [ "${{ needs.decide.outputs.beta }}" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=false --silent
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
          fi
      # Every release, beta or not, also feeds the beta channel.
      - name: Update the beta channel
        run: node .github/scripts/beta-channel.mjs
